<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лена · 27 сентября</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#150a14;--ink:#f6ecdf;--mut:#b9a48c;--gold:#d8b26e;--gold2:#f3d795;--velvet:#7a1f3d;--line:rgba(216,178,110,.25);
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 700px at 50% -10%,#2a1226 0%,var(--bg) 60%);color:var(--ink);font-family:var(--sans);font-weight:300;overflow-x:hidden}
#dust{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 22px 90px}
.ov{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);font-weight:400}
.rev{opacity:0;transform:translateY(28px);filter:blur(6px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1),filter 1s}
.rev.on{opacity:1;transform:none;filter:none}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#name{font-family:var(--serif);font-weight:500;font-size:72px;line-height:1.05;margin:16px 0 8px}
#name span{display:inline-block;opacity:0;animation:lt 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes lt{from{opacity:0;transform:translateY(30px) rotate(3deg);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.hsub{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--mut)}
.hfrom{margin-top:22px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.orn{margin:26px auto 0;width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
.orn::after{content:'❖';position:absolute;left:50%;top:-9px;transform:translateX(-50%);color:var(--gold);font-size:12px}
.sec{margin-top:80px;text-align:center}
.sec .ov{display:block;margin-bottom:18px}
.cakeWrap{display:flex;flex-direction:column;align-items:center;gap:26px}
.cake{position:relative;width:260px;height:250px}
.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:250px;height:16px;border-radius:50%;background:linear-gradient(180deg,#3a2130,#241320);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 8px 8px;background:linear-gradient(180deg,#8c2547 0%,var(--velvet) 45%,#5c152e 100%);box-shadow:inset 0 2px 6px rgba(255,255,255,.15),inset 0 -10px 20px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.5)}
.tier::before{content:'';position:absolute;top:-4px;left:0;right:0;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));opacity:.9}
.t3{bottom:14px;width:220px;height:64px}
.t2{bottom:76px;width:168px;height:56px}
.t1{bottom:130px;width:118px;height:50px}
.candles{position:absolute;bottom:178px;left:50%;transform:translateX(-50%);display:flex;gap:16px}
.candle{position:relative;width:7px;height:44px;border-radius:4px;background:linear-gradient(180deg,#f3d795,#d8b26e 60%,#b98f4e)}
.flame{position:absolute;left:50%;top:-20px;width:14px;height:22px;margin-left:-7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 75%,#fff7d6 0%,#ffd76a 40%,#ff9d3c 70%,rgba(255,120,40,0) 100%);filter:blur(.4px);transform-origin:50% 100%;animation:flick .28s ease-in-out infinite alternate;box-shadow:0 0 18px 6px rgba(255,180,80,.35)}
@keyframes flick{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.12,1.2) rotate(2deg)}}
.candle.wind .flame{animation:flick .09s ease-in-out infinite alternate;transform:scale(1.25,1.35)}
.smoke{position:absolute;left:50%;top:-26px;width:4px;height:26px;margin-left:-2px;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));opacity:0}
.candle.out .flame{transform:scale(0);opacity:0;transition:.35s}
.candle.out .smoke{opacity:1;animation:smk 1.8s ease-out forwards}
@keyframes smk{from{transform:translateY(0) scaleY(.4);opacity:.7}to{transform:translateY(-46px) scaleY(1.6);opacity:0}}
.blowHint{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--mut);min-height:24px}
.btnGold{border:1px solid var(--gold);background:none;color:var(--gold);border-radius:999px;padding:15px 30px;font-family:var(--sans);font-size:12px;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;transition:.3s;user-select:none;-webkit-user-select:none;touch-action:none}
.btnGold:active{background:var(--gold);color:var(--bg)}
#letterSec{display:none}
#letterSec.on{display:block}
.letter{border:1px solid var(--line);border-radius:20px;padding:30px 24px;background:linear-gradient(180deg,rgba(216,178,110,.06),rgba(122,31,61,.08));font-family:var(--serif);font-size:19px;line-height:1.75;white-space:pre-line;text-align:left}
.sign{margin-top:22px;text-align:right;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold)}
.gifts{display:flex;justify-content:center;gap:22px}
.gift{position:relative;width:92px;height:92px;cursor:pointer;transition:transform .3s}
.gift:active{transform:scale(.94)}
.gbox{position:absolute;inset:14px 0 0;border-radius:10px;background:linear-gradient(180deg,#8c2547,#5c152e);box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 2px 5px rgba(255,255,255,.12)}
.gbox::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:10px;margin-left:-5px;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.glid{position:absolute;top:0;left:-4px;right:-4px;height:20px;border-radius:8px;background:linear-gradient(180deg,#a12c55,#7a1f3d);box-shadow:0 4px 10px rgba(0,0,0,.4);transform-origin:10% 100%;transition:transform .5s cubic-bezier(.3,1.4,.4,1)}
.glid::after{content:'';position:absolute;left:50%;top:-12px;width:26px;height:16px;margin-left:-13px;border:3px solid var(--gold);border-radius:50% 50% 0 0;border-bottom:none;background:none}
.gift.open .glid{transform:rotate(-38deg) translateY(-8px)}
.gift .gn{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.2em;color:var(--mut)}
.gift.secret .gbox{background:linear-gradient(180deg,#e7c989,#a9822f 60%,#7a5a1e);box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 2px 6px rgba(255,255,255,.35)}
.gift.secret .gbox::before{background:linear-gradient(180deg,#7a1f3d,#5c152e)}
.gift.secret .glid{background:linear-gradient(180deg,#f3d795,#d8b26e)}
.gift.secret .glid::after{border-color:#7a1f3d}
.gift.secret{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 14px rgba(216,178,110,.55))}}
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,5,10,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:26px}
#modal.show{display:flex;animation:fi .4s}
@keyframes fi{from{opacity:0}to{opacity:1}}
#mBox{max-width:420px;width:100%;border:1px solid var(--line);border-radius:22px;padding:30px 26px;background:#1d0f1b;text-align:center;animation:pop .45s cubic-bezier(.3,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shk{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#mBox .em{font-size:40px}
#mBox .tt{font-family:var(--serif);font-size:22px;margin:12px 0 10px;color:var(--gold2)}
#mBox .bd{font-size:14px;line-height:1.7;color:var(--mut)}
#mBox button{margin-top:20px;border:1px solid var(--gold);background:none;color:var(--gold);border-radius:999px;padding:11px 24px;font-size:11px;letter-spacing:.25em;text-transform:uppercase;cursor:pointer}
#cheers{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;font-size:30px;background:none;border:none;cursor:pointer;filter:drop-shadow(0 0 12px rgba(216,178,110,.5));animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.foot{margin-top:90px;text-align:center}
.fsign{font-family:var(--serif);font-style:italic;font-size:24px}
.fnote{margin-top:10px;font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--mut)}
.cf{position:fixed;top:-12px;z-index:50;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style></head><body>
<canvas id="dust"></canvas>
<div class="wrap">
 <section class="hero">
  <span class="ov" id="over"></span>
  <h1 id="name"></h1>
  <div class="hsub">с днём рождения, наша дорогая</div>
  <div class="orn"></div>
  <div class="hfrom" id="hfrom"></div>
 </section>

 <section class="sec rev">
  <span class="ov">твой торт ждёт</span>
  <div class="cakeWrap">
   <div class="cake"><div class="candles" id="candles"></div>
    <div class="tier t1"></div><div class="tier t2"></div><div class="tier t3"></div><div class="plate"></div></div>
   <div class="blowHint" id="blowHint">Свечей столько, сколько у тебя желаний, — все не поместились. Эти задуй одним дыханием…</div>
   <button class="btnGold" id="blowBtn">Держи и дуй 🌬</button>
  </div>
 </section>

 <section class="sec rev" id="letterSec">
  <span class="ov">письмо, которое ждало свечей</span>
  <div class="letter" id="letter"></div>
  <div class="sign" id="sign"></div>
 </section>

 <section class="sec rev">
  <span class="ov">четыре подарка — последний под замком</span>
  <div class="gifts" id="gifts"></div>
 </section>

 <footer class="foot rev">
  <div class="fsign" id="fsign"></div>
  <div class="fnote">сделано с любовью и кодом</div>
 </footer>
</div>
<button id="cheers" title="Чокнуться">🥂</button>
<div id="modal"><div id="mBox"><div class="em" id="mEm"></div><div class="tt" id="mTt"></div><div class="bd" id="mBd"></div><button onclick="document.getElementById('modal').classList.remove('show')">Закрыть</button></div></div>
<script>
/* ===== РЕДАКТИРУЙ ЗДЕСЬ ===== */
const CONFIG={
 over:'двадцать седьмое сентября',
 name:'Лена',
 from:'от Саши и Юли',
 sign:'— с любовью, Саша и Юля',
 fsign:'Саша и Юля',
 candles:5,
 letter:'Лена, с днём рождения!\n\nСегодня хочется сказать тебе главное: ты — тепло. То самое, которое не шумит, а просто заполняет дом целиком — твоим смехом, твоими историями, твоим умением быть рядом именно тогда, когда это нужнее всего.\n\nТы умеешь делать красиво: стол, вечер, настроение, жизнь. И умеешь делать так, чтобы людям рядом было хорошо, — это редкий дар, и он у тебя, похоже, с рождения.\n\nПусть этот год отвечает тебе взаимностью: добрыми новостями по утрам, хорошими людьми днём и тихим счастьем по вечерам. Пусть силы прибавляются быстрее, чем тратятся, а поводы для праздника находят тебя чаще, чем даты в календаре.\n\nМы тебя очень любим. И желание, которое ты задула вместе со свечами, уже принято в обработку — гарантийный срок: навсегда, исполнители: мы.',
 gifts:[
  {em:'☕',tt:'Сертификат на кофе-выход',bd:'Один (или десять) поводов вытащить тебя куда-нибудь вдвоём: кофе, болтовня, никаких взрослых разговоров о взрослом.'},
  {em:'🛠',tt:'Сертификат «племянник по вызову»',bd:'Тяжёлые сумки, гаджеты, которые «сами сломались», и сборка мебели — бессрочно, без выходных, по одному звонку.'},
  {em:'🎈',tt:'Сертификат на смех без причины',bd:'Гарантируем минимум десять поводов смеяться до слёз в ближайший месяц. Исполнители: те же, кто подписал письмо.'}],
 secret:{
  q:'«Крутится и вертится, как обезьянка, — это наша маленькая…»',
  a:'янка',
  hint:'четыре буквы, начинается на «Я» — ту, что сама о себе говорит',
  cert:'cert.pdf',
  tt:'Сертификат имени маленькой обезьянки',
  win:'Верно! Янка — наш маленький ураган 🌪 Сертификат уже спешит на экран.'}
};
/* ===== магия ===== */
const $=s=>document.querySelector(s);
$('#over').textContent=CONFIG.over;$('#hfrom').textContent=CONFIG.from;$('#sign').textContent=CONFIG.sign;$('#fsign').textContent=CONFIG.fsign;$('#letter').textContent=CONFIG.letter;
$('#name').innerHTML=[...CONFIG.name].map((c,i)=>'<span style="animation-delay:'+(0.15+i*0.1)+'s">'+c+'</span>').join('');
/* золотая пыль */
const cv=$('#dust'),cx=cv.getContext('2d');let P=[];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
size();addEventListener('resize',size);
for(let i=0;i<40;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.4,vy:-(Math.random()*.35+.08),vx:(Math.random()-.5)*.25,a:Math.random()*.5+.15});
(function draw(){cx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=innerHeight+5;p.x=Math.random()*innerWidth}cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle='rgba(216,178,110,'+p.a+')';cx.fill()});requestAnimationFrame(draw)})();
/* проявление секций */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rev').forEach(e=>io.observe(e));
/* свечи */
const cEl=$('#candles');let out=false;
for(let i=0;i<CONFIG.candles;i++)cEl.innerHTML+='<div class="candle"><i class="flame"></i><i class="smoke"></i></div>';
const candles=[...cEl.children];
function blowOut(){if(out)return;out=true;
 candles.forEach((c,i)=>setTimeout(()=>{c.classList.add('out');c.classList.remove('wind')},i*180));
 $('#blowHint').textContent='Желание принято и поставлено в очередь на исполнение ✨';
 $('#blowBtn').style.display='none';
 setTimeout(()=>{boom(70);chime();
  const ls=$('#letterSec');ls.classList.add('on');ls.classList.add('rev');
  requestAnimationFrame(()=>ls.classList.add('on'));
  setTimeout(()=>ls.scrollIntoView({behavior:'smooth',block:'center'}),400)},900);
}
/* звук */
let AC;function chime(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 [523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
 const t=AC.currentTime+i*0.13;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+1.3);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+1.4)})}catch(e){}}
/* задув через микрофон */
let micOn=false,hot=0;
async function initMic(){if(micOn)return;micOn=true;
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:true});
  const ac=new AudioContext(),src=ac.createMediaStreamSource(st),an=ac.createAnalyser();an.fftSize=512;src.connect(an);
  const d=new Uint8Array(an.fftSize);
  setInterval(()=>{an.getByteTimeDomainData(d);let s=0;for(let i=0;i<d.length;i++){const v=(d[i]-128)/128;s+=v*v}
   const rms=Math.sqrt(s/d.length);
   if(rms>0.16){hot++;candles.forEach(c=>c.classList.add('wind'))}else{hot=Math.max(0,hot-2);if(hot===0)candles.forEach(c=>c.classList.remove('wind'))}
   if(hot>10)blowOut();
  },50);
  $('#blowHint').textContent='Микрофон слушает твоё дыхание… дуй смело!';
 }catch(e){$('#blowHint').textContent='Микрофон спит — держи кнопку ниже и дуй'}
}
addEventListener('pointerdown',initMic,{once:true});
/* кнопка-запас */
let holdT=null;
const bb=$('#blowBtn');
bb.addEventListener('pointerdown',()=>{holdT=setTimeout(blowOut,900);bb.textContent='Дую-дую… 🌬'});
['pointerup','pointerleave','pointercancel'].forEach(ev=>bb.addEventListener(ev,()=>{clearTimeout(holdT);if(!out)bb.textContent='Держи и дуй 🌬'}));
/* подарки */
const gEl=$('#gifts');
CONFIG.gifts.forEach((g,i)=>{const d=document.createElement('div');d.className='gift';
 d.innerHTML='<div class="glid"></div><div class="gbox"></div><div class="gn">'+(i+1)+'</div>';
 d.onclick=()=>{if(d.classList.contains('open'))return;d.classList.add('open');chime();
  setTimeout(()=>{$('#mEm').textContent=g.em;$('#mTt').textContent=g.tt;$('#mBd').textContent=g.bd;$('#modal').classList.add('show')},450)};
 gEl.appendChild(d)});
/* четвёртый, золотой — под загадкой */
const sg=document.createElement('div');sg.className='gift secret';
sg.innerHTML='<div class="glid"></div><div class="gbox"></div><div class="gn">4</div>';
sg.onclick=()=>{if(sg.classList.contains('open'))return;sg.classList.add('open');chime();setTimeout(openRiddle,450)};
gEl.appendChild(sg);
function openRiddle(){
 $('#mEm').textContent='📜';
 $('#mTt').textContent='Четвёртый подарок под замком';
 $('#mBd').innerHTML='<div style="font-family:var(--serif);font-style:italic;font-size:17px;color:#f6ecdf;line-height:1.6">'+CONFIG.secret.q+'</div>'+
 '<input id="rIn" placeholder="Твой ответ…" style="margin-top:16px;background:#150a14;border:1px solid rgba(216,178,110,.35);border-radius:12px;padding:12px 14px;color:#f6ecdf;font-size:16px;outline:none;width:100%;text-align:center">'+
 '<div id="rHint" style="min-height:18px;margin-top:8px;font-size:12px;color:#b9a48c"></div>'+
 '<button id="rGo" style="margin-top:10px;border:1px solid #d8b26e;background:none;color:#d8b26e;border-radius:999px;padding:11px 26px;font-size:11px;letter-spacing:.25em;text-transform:uppercase;cursor:pointer">Открыть замок</button>';
 $('#modal').classList.add('show');
 $('#rGo').onclick=checkRiddle;
 $('#rIn').onkeydown=e=>{if(e.key==='Enter')checkRiddle()};
 setTimeout(()=>$('#rIn').focus(),300);
}
function checkRiddle(){
 const v=$('#rIn').value.trim().toLowerCase().replace('ё','е');
 if(v===CONFIG.secret.a){
  chime();boom(50);
  $('#mTt').textContent='Замок открыт!';
  $('#mBd').innerHTML='<div style="font-size:15px;line-height:1.7;color:#b9a48c">'+CONFIG.secret.win+'</div>'+
  '<a href="'+CONFIG.secret.cert+'" target="_blank" style="display:inline-block;margin-top:18px;border:1px solid #d8b26e;background:none;color:#d8b26e;border-radius:999px;padding:12px 26px;font-size:11px;letter-spacing:.25em;text-transform:uppercase;text-decoration:none">Открыть сертификат 📜</a>';
 }else{
  $('#rHint').textContent='Не-а… Подсказка: '+CONFIG.secret.hint;
  const b=$('#mBox');b.style.animation='none';void b.offsetWidth;b.style.animation='shk .4s';
 }
}
/* бокалы */
$('#cheers').onclick=()=>{chime();boom(24);toastClink()};
function toastClink(){const t=document.createElement('div');t.textContent='🥂 За Лену! Звонко и от сердца';
 t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:#1d0f1b;border:1px solid rgba(216,178,110,.4);border-radius:999px;padding:12px 22px;font-family:var(--serif);font-style:italic;font-size:16px;color:#f3d795;animation:fi .4s';
 document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
/* конфетти */
function boom(n){const cols=['#d8b26e','#f3d795','#8c2547','#f6ecdf'];
 for(let i=0;i<n;i++){const e=document.createElement('div');e.className='cf';
  e.style.left=Math.random()*100+'vw';e.style.width=(4+Math.random()*5)+'px';e.style.height=(8+Math.random()*8)+'px';
  e.style.background=cols[i%cols.length];e.style.animationDuration=(2+Math.random()*2.4)+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),4600)}}
</script></body></html>
